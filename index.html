<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IOC Extractor</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>IOC Extractor</h1>
    <textarea id="inputText" placeholder="Paste text here (incident reports, emails, etc.)"></textarea>
    <button id="extractBtn">Extract IOCs</button>
    <div id="loadingIndicator" style="display: none;">
      <p>Processing... Please wait.</p>
    </div>
    <div id="results"></div>
  </div>
  <script src="scripts.js"></script>
</body>
</html>
